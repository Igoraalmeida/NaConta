<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <aside class="sidebar">
        <header class="sidebar-header">
            <a href="">
                <img src="" alt="NaConta">
            </a>
        </header>

        <nav class="sidebar-nav">
            <ul class="nav-links">
                <li>
                    <a href="#">
                        <img src="#">
                        <span>Resumo</span>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <img src="#">
                        <span>Planilha</span>
                    </a>
                </li>

                <li>
                    <a href="/Home/index.html">
                        <img src="#">
                        <span>Início</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

   <main class="content">
    
    
    <header class="content-header">
        
        <div class="user-greeting">
            <span class="current-date">Hora e data do dia</span>
            <h1 class="user-name">Olá, Igor</h1>
            <p class="subtitle">Resumo financeiro do mês</p>
        </div>

        <button class="butn-new-transaction">
                <img src="#">
                <span>Nova Transação</span>
        </button>
    </header>

    <section class="container">
        
        <div class="cash-flow">
            
            <div class="cash-in">
                <span class="label">Entradas</span>
                <span class="value" id="Cash-in" >R$ 0,00</span>
            </div>
            <div class="cash-out">
                <span class="label">Saídas</span>
                <span class="value" id="Cash-out" >R$ 0,00</span>
            </div>
            <div class="cash-balance">
                <span class="label">Saldo</span>
                <span class="value" id="Cash-balance" >R$ 0,00</span>
            </div>
        </div>

    <section class="balance-resumes">
        <article class="month-balance-resume">
            <h2>Resumo financeiro do mês</h2>
        </article>

        <article class="last-balance-resume">
            <h2>Ultimas movimentações</h2>
            <ul class="transactions-list" id="transactions-list"></ul>
        </article>
    </section>
   </main>

</body>
</html>
